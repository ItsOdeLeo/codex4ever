# Rebuilds the static site with fresh reset evidence and deploys it to Cloudflare Pages.
# Secrets are only read by this scheduled/manual/main-branch job; never add a
# pull_request_target trigger, which would expose them to code from forks.
name: Deploy site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Each run saves a new entry; the newest earlier one is restored, so posts
      # already classified are not sent to the LLM again.
      - uses: actions/cache@v4
        with:
          path: .cache/classifications.json
          key: classifications-${{ github.run_id }}
          restore-keys: classifications-
      - run: npm run site:build
        env:
          PUBLIC_SITE_URL: https://usageplanner.com
          USAGE_PLANNER_LLM_MODEL: ${{ vars.USAGE_PLANNER_LLM_MODEL }}
          USAGE_PLANNER_LLM_BASE_URL: ${{ vars.USAGE_PLANNER_LLM_BASE_URL }}
          USAGE_PLANNER_LLM_API_KEY: ${{ secrets.USAGE_PLANNER_LLM_API_KEY }}
          USAGE_PLANNER_X_BEARER_TOKEN: ${{ secrets.USAGE_PLANNER_X_BEARER_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codex4ever --branch=main
